<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student CRUD</title>

  <!-- Pretty look (Bootstrap only; no JS needed) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { padding: 24px; }
    h1 { margin-bottom: 16px; }
    .muted { color:#6c757d; }
    .table thead th { user-select: none; cursor: pointer; }
    .table thead th .sort { font-size: 12px; margin-left: 4px; }
    .actions { display:flex; gap:.5rem; flex-wrap:wrap; }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:.5rem; }
    @media (max-width: 992px){
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="container">

  <h1>Student CRUD</h1>

  <!-- Form row -->
  <div class="form-grid mb-2">
    <input id="name"  class="form-control" placeholder="Name" />
    <input id="major" class="form-control" placeholder="Major" />
    <input id="grade" class="form-control" placeholder="Grade (0-100)" type="number" min="0" max="100" step="0.1"/>
    <button class="btn btn-primary" onclick="create()">Add</button>
  </div>

  <div class="actions mb-3">
    <span class="muted">Select a row → Update/Delete.</span>
    <button class="btn btn-outline-secondary btn-sm" onclick="update()">Update</button>
    <button class="btn btn-outline-danger btn-sm" onclick="remove()">Delete</button>
    <button class="btn btn-outline-dark btn-sm" onclick="clearForm()">Clear</button>

    <!-- (1) Search / filter by name -->
    <div class="ms-auto d-flex gap-2">
      <input id="search" class="form-control form-control-sm" style="min-width:240px"
             placeholder="Search by name..." oninput="render()">
    </div>
  </div>

  <table id="tbl" class="table table-bordered table-hover align-middle">
    <thead class="table-light">
      <tr>
        <!-- (3) Clickable column headers for sorting -->
        <th data-key="id"    onclick="setSort('id')">ID   <span class="sort"></span></th>
        <th data-key="name"  onclick="setSort('name')">Name <span class="sort"></span></th>
        <th data-key="major" onclick="setSort('major')">Major <span class="sort"></span></th>
        <th data-key="grade" onclick="setSort('grade')">Grade <span class="sort"></span></th>
        <th style="width:120px">Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
/* ------------------ CONFIG ------------------ */
const base = location.origin + "/api/students";

/* ------------------ STATE ------------------- */
let students = [];       // all rows from the server
let selectedId = null;   // currently selected row
let sortKey = "id";      // (3) current sort column
let sortDir = "asc";     // (3) asc | desc

/* ------------------ RENDER ------------------ */
async function list() {
  const res = await fetch(base);
  students = await res.json();
  render();
}

/* (1)+(3) Filter + sort + redraw table */
function render() {
  // filter
  const q = document.getElementById("search").value.trim().toLowerCase();
  let data = students.filter(s => s.name?.toLowerCase().includes(q));

  // sort
  data.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === "string") va = va.toLowerCase();
    if (typeof vb === "string") vb = vb.toLowerCase();
    if (va < vb) return sortDir === "asc" ? -1 : 1;
    if (va > vb) return sortDir === "asc" ?  1 : -1;
    return 0;
  });

  // draw
  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = "";
  data.forEach(s => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.id ?? ""}</td>
      <td>${escapeHtml(s.name ?? "")}</td>
      <td>${escapeHtml(s.major ?? "")}</td>
      <td>${s.grade ?? ""}</td>
      <td><button class="btn btn-sm btn-outline-primary" onclick='select(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Select</button></td>`;
    tbody.appendChild(tr);
  });

  // update sort indicators
  document.querySelectorAll('#tbl thead th[data-key]').forEach(th => {
    th.querySelector('.sort').textContent =
      (th.dataset.key === sortKey) ? (sortDir === 'asc' ? '▲' : '▼') : '';
  });
}

/* Toggle sort (3) */
function setSort(key) {
  if (sortKey === key) sortDir = (sortDir === "asc") ? "desc" : "asc";
  else { sortKey = key; sortDir = "asc"; }
  render();
}

/* ------------------ FORM HELPERS ------------ */
function readForm() {
  return {
    name:  document.getElementById("name").value.trim(),
    major: document.getElementById("major").value.trim(),
    grade: document.getElementById("grade").value === "" ? NaN
           : parseFloat(document.getElementById("grade").value)
  };
}
function fillForm(s) {
  selectedId = s.id;
  document.getElementById("name").value  = s.name ?? "";
  document.getElementById("major").value = s.major ?? "";
  document.getElementById("grade").value = s.grade ?? "";
}
function select(s) { fillForm(s); }
function clearForm() {
  selectedId = null;
  document.getElementById("name").value = "";
  document.getElementById("major").value = "";
  document.getElementById("grade").value = "";
}

/* (2) Client-side validation */
function validateForm(body) {
  if (!body.name)  throw "Name is required";
  if (!body.major) throw "Major is required";
  if (Number.isNaN(body.grade)) throw "Grade is required";
  if (body.grade < 0 || body.grade > 100) throw "Grade must be between 0 and 100";
}

/* ------------------ CRUD -------------------- */
async function create() {
  try {
    const body = readForm();
    validateForm(body);
    await fetch(base, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    clearForm();
    list();
  } catch (e) { alert(e); }
}

async function update() {
  try {
    if (selectedId == null) throw "Select a row first";
    const body = readForm();
    validateForm(body);
    await fetch(`${base}/${selectedId}`, {
      method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    clearForm();
    list();
  } catch (e) { alert(e); }
}

async function remove() {
  try {
    if (selectedId == null) throw "Select a row first";
    await fetch(`${base}/${selectedId}`, { method: "DELETE" });
    clearForm();
    list();
  } catch (e) { alert(e); }
}

/* ------------------ UTIL -------------------- */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* boot */
list();
</script>
</body>
</html>
